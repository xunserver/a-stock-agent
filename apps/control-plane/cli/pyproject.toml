[project]
name = "astock-ctl"
version = "0.1.0"
description = "Thin HTTP client for the A-stock control-plane daemon"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
astock-ctl = "astock_ctl.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astock_ctl"]
