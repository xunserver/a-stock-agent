[project]
name = "astock-core"
version = "0.1.0"
description = "Shared market database access for A-stock tools"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astock_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/astock_core/financial_statement_labels.json" = "astock_core/financial_statement_labels.json"
"src/astock_core/financial_statement_templates.json" = "astock_core/financial_statement_templates.json"
