[project]
name = "astock-analyze"
version = "0.1.0"
description = "TradingAgents wrapper for A-share multi-agent analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "astock-core",
    "tradingagents",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astock_analyze"]

[tool.uv.sources]
astock-core = { path = "../../packages/core", editable = true }
tradingagents = { path = "../../vendor/tradingagents", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
