[project]
name = "astock-ingest"
version = "0.1.0"
description = "AKShare -> local SQLite ingest"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.18.94",
    "astock-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astock"]

[tool.uv.sources]
astock-core = { path = "../../packages/core", editable = true }
