# LightGBM + Alpha158，按本仓库 data/qlib 实际区间（约 2021-08-26 ~ 2026-08-26）
# 跑法（在任意目录均可）：
#   uv --directory tools/qlib run python -m astock_qlib workflow
# 或：
#   uv --directory tools/qlib run qrun configs/workflow_lightgbm_alpha158.yaml

qlib_init:
    provider_uri: "/home/xun/project/a-stock-agent/data/qlib"
    region: cn

market: &market csi300
benchmark: &benchmark SH000300

# Alpha158 滚动窗最长约 60 日；handler 从 2021-11 起，给足预热
data_handler_config: &data_handler_config
    start_time: 2021-11-01
    # 日历末日是 2026-08-26；回测要多看一天，结束日留到前一交易日
    end_time: 2026-08-25
    fit_start_time: 2021-11-01
    fit_end_time: 2024-06-28
    instruments: *market

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2025-07-01
        end_time: 2026-08-25
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 8
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                # ~2.7y / 1y / 1.1y（交易日）
                train: [2021-11-01, 2024-06-28]
                valid: [2024-07-01, 2025-06-30]
                test: [2025-07-01, 2026-08-25]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
