[project]
name = "astock-qlib"
version = "0.1.0"
description = "Qlib research environment on top of the local market database"
requires-python = ">=3.11,<3.13"
dependencies = [
    "astock-core",
    "numpy>=1.26",
    "pandas>=2.1,<3",
    "pyqlib>=0.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astock_qlib"]

[tool.uv.sources]
astock-core = { path = "../../packages/core", editable = true }
