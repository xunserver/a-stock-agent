[project]
name = "astock-select"
version = "0.1.0"
description = "Daily pre-market stock selection"
requires-python = ">=3.11"
dependencies = [
    "astock-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astock_select"]

[tool.uv.sources]
astock-core = { path = "../../packages/core", editable = true }
